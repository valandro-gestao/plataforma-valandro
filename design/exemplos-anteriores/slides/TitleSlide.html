<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../../design-system/styles.css">
<style>*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:var(--font-body)}
.slide{position:relative;width:100%;height:100%;background:var(--navy-900)}
.slide img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.overlay{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,20,30,.92) 30%,rgba(10,30,46,.55) 100%)}
.content{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:80px}
.content img.logo{width:220px;margin-bottom:40px}
h1{color:#fff;font-family:var(--font-display);font-size:52px;font-weight:800;letter-spacing:var(--tracking-tight);line-height:1.1;max-width:760px}
p{color:rgba(255,255,255,.75);font-size:19px;margin-top:18px}
</style></head><body>
<div class="slide">
<img class="bg" src="../../../design-system/assets/wallpaper-handshake-navy.png">
<div class="overlay"></div>
<div class="content">
<img class="logo" src="../../../design-system/assets/logo-valandro-white.png">
<h1>Proposta Comercial</h1>
<p>Consultoria em controladoria financeira e gestão</p>
</div>
</div>
</body></html>
