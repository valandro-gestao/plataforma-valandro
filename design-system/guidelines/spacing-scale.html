<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Escala base de 4px" name="Spacing Scale" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{font-family:var(--font-mono);padding:16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--text-muted)}
.bar{height:12px;background:var(--blue-500);border-radius:2px}
</style></head><body>
<div class="row"><div class="bar" style="width:var(--space-1)"></div>4</div>
<div class="row"><div class="bar" style="width:var(--space-2)"></div>8</div>
<div class="row"><div class="bar" style="width:var(--space-4)"></div>16</div>
<div class="row"><div class="bar" style="width:var(--space-6)"></div>24</div>
<div class="row"><div class="bar" style="width:var(--space-8)"></div>32</div>
<div class="row"><div class="bar" style="width:var(--space-12)"></div>48</div>
<div class="row"><div class="bar" style="width:var(--space-16)"></div>64</div>
</body></html>
