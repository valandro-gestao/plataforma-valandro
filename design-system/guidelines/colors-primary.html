<!-- @dsCard group="Colors" viewport="700x160" subtitle="Azul institucional — cor principal da marca" name="Primary Blue" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{font-family:var(--font-body);padding:16px}
.row{display:flex;gap:0}
.sw{flex:1;height:88px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11px;font-family:var(--font-mono)}
.l{color:var(--text-primary)}
.label{display:flex;margin-top:6px}
.label span{flex:1;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
</style></head><body>
<div class="row">
<div class="sw l" style="background:var(--blue-50);color:var(--text-primary)">50</div>
<div class="sw l" style="background:var(--blue-100);color:var(--text-primary)">100</div>
<div class="sw" style="background:var(--blue-300)">300</div>
<div class="sw" style="background:var(--blue-500)">500</div>
<div class="sw" style="background:var(--blue-600)">600</div>
<div class="sw" style="background:var(--blue-700)">700</div>
</div>
<div class="label"><span>--blue-50</span><span>--blue-100</span><span>--blue-300</span><span>--blue-500</span><span>--blue-600</span><span>--blue-700</span></div>
</body></html>
