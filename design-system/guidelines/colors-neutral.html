<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{font-family:var(--font-body);padding:16px}
.row{display:flex}
.sw{flex:1;height:96px;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--border-subtle)}
.label{display:flex;margin-top:6px}
.label span{flex:1;font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--gray-25);color:var(--text-primary)">25</div>
<div class="sw" style="background:var(--gray-50);color:var(--text-primary)">50</div>
<div class="sw" style="background:var(--gray-100);color:var(--text-primary)">100</div>
<div class="sw" style="background:var(--gray-200);color:var(--text-primary)">200</div>
<div class="sw" style="background:var(--gray-400);color:#fff">400</div>
<div class="sw" style="background:var(--gray-600);color:#fff">600</div>
<div class="sw" style="background:var(--gray-800);color:#fff">800</div>
<div class="sw" style="background:var(--gray-900);color:#fff">900</div>
</div>
</body></html>
