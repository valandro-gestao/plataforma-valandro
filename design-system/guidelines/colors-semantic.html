<!-- @dsCard group="Colors" viewport="700x150" subtitle="Uso restrito: positivo, negativo, alerta e chamadas importantes" name="Semantic Status" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{font-family:var(--font-body);padding:16px;display:flex;gap:12px}
.chip{flex:1;border-radius:var(--radius-md);padding:14px;font-size:13px}
.chip b{display:block;font-family:var(--font-display);font-size:14px;margin-bottom:4px}
</style></head><body>
<div class="chip" style="background:var(--status-positive-bg);color:var(--status-positive)"><b>Positivo</b>Meta atingida</div>
<div class="chip" style="background:var(--status-negative-bg);color:var(--status-negative)"><b>Negativo</b>Abaixo do previsto</div>
<div class="chip" style="background:var(--status-warning-bg);color:var(--status-warning)"><b>Alerta</b>Atenção necessária</div>
</body></html>
