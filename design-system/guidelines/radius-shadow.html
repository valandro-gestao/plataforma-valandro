<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
*{margin:0;box-sizing:border-box}body{font-family:var(--font-mono);font-size:11px;padding:20px;display:flex;gap:16px;color:var(--text-muted)}
.box{width:110px;height:90px;background:var(--white);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)">sm / shadow-sm</div>
<div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md)">md / shadow-md</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)">lg / shadow-lg</div>
<div class="box" style="border-radius:var(--radius-xl)">xl</div>
</body></html>
